name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  web:
    name: Lint, typecheck, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_APP_NAME: Lisent CRM
          NEXT_PUBLIC_API_DOMAIN: http://localhost:3011
          NEXT_PUBLIC_WEBSITE_DOMAIN: http://localhost:3011
          NEXT_PUBLIC_API_BASE_PATH: /api/auth
          NEXT_PUBLIC_WEBSITE_BASE_PATH: /auth
          CRM_BASE_URL: http://localhost:9090
          CRM_INTERNAL_API_KEY: dummy
          SUPERTOKENS_CONNECTION_URI: http://localhost:3567
          SUPERTOKENS_API_KEY: dummy
        run: npm run build

      - name: Dependency audit (prod only)
        run: npm audit --production --audit-level=high
        continue-on-error: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t crm-web:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: crm-web:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
