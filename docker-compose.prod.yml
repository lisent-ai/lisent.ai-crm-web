services:
  crm-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_API_DOMAIN: ${NEXT_PUBLIC_API_DOMAIN}
        NEXT_PUBLIC_WEBSITE_DOMAIN: ${NEXT_PUBLIC_WEBSITE_DOMAIN}
        NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH}
        NEXT_PUBLIC_WEBSITE_BASE_PATH: ${NEXT_PUBLIC_WEBSITE_BASE_PATH}
        NEXT_PUBLIC_INTEGRATIONS_HUB_ENABLED: ${NEXT_PUBLIC_INTEGRATIONS_HUB_ENABLED:-false}
        NEXT_PUBLIC_INTRANET_INTEGRATION_ENABLED: ${NEXT_PUBLIC_INTRANET_INTEGRATION_ENABLED:-false}
        # Phase 1+2 — Marketing module + Meta Lead Ads + (optional) OAuth flow.
        # OAuth flag stays false until Lisent Meta App is created and
        # META_APP_ID is set on the CRM service side; otherwise the
        # "Connect with Facebook" button would receive 501 from the API.
        NEXT_PUBLIC_MARKETING_MODULE_ENABLED: ${NEXT_PUBLIC_MARKETING_MODULE_ENABLED:-false}
        NEXT_PUBLIC_META_INTEGRATION_ENABLED: ${NEXT_PUBLIC_META_INTEGRATION_ENABLED:-false}
        NEXT_PUBLIC_META_OAUTH_ENABLED: ${NEXT_PUBLIC_META_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_NANGO_HOST: ${NEXT_PUBLIC_NANGO_HOST:-https://oauth.lisent.ai}
        NEXT_PUBLIC_NANGO_PUBLIC_KEY: ${NEXT_PUBLIC_NANGO_PUBLIC_KEY:-}
    restart: unless-stopped
    environment:
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN}
      SUPERTOKENS_CONNECTION_URI: ${SUPERTOKENS_CONNECTION_URI}
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-}
      AUTH_DB_DSN: ${AUTH_DB_DSN}
      CRM_BASE_URL: ${CRM_BASE_URL}
      CRM_INTERNAL_API_KEY: ${CRM_INTERNAL_API_KEY}
      PLATFORM_SUPER_ADMIN_EMAILS: ${PLATFORM_SUPER_ADMIN_EMAILS:-}

      # Phase 2.O — qualifier v1 BFF proxy (/api/qualifier-v1/*). All three
      # MUST be set in Dokploy. QUALIFIER_PLATFORM_TOKEN must exactly match
      # the qualifier app's PLATFORM_ADMIN_TOKEN value.
      QUALIFIER_BASE_URL: ${QUALIFIER_BASE_URL}
      QUALIFIER_PLATFORM_TOKEN: ${QUALIFIER_PLATFORM_TOKEN}
      QUALIFIER_INTERNAL_API_KEY: ${QUALIFIER_INTERNAL_API_KEY}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
